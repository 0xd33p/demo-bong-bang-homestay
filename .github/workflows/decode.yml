name: Decode images
on:
  push:
    branches: [main]
    paths: ['b64/DONE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 images
        run: |
          mkdir -p images
          for f in b64/*.b64; do base64 -d "$f" > "images/$(basename "$f" .b64)"; done
          git rm -rq b64
          ls -la images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Decode images [skip ci]"
          git push
